<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Klausurplaner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131417">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klausuren">
<link rel="manifest" href="handy.webmanifest">
<link rel="icon" href="icon-k-192.png">
<link rel="apple-touch-icon" href="icon-k-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* VOICE: ruhig, aufgeräumt, wie ein guter Kalender-Client mit Notion-Wärme
   IDEA: Schulplaner als Kalender plus Modulübersicht aus Notion
   PICTURE: Startbild oben, darunter der Kalender bzw. die Modul-Zeitleiste
   COLOUR and TYPE: weiße oder nachtblaue Fläche, dunkle Seitenleiste, Pastell je Fach, Rot für Heute und Prüfungen; Inter
   LAYOUT: Seitenleiste links, auf dem Handy unten; Detailpanel rechts */
:root{color-scheme:light dark;--bg:light-dark(#fff,#16181d);--soft:light-dark(#f6f6f7,#1c1f25);--card:light-dark(#fff,#20232a);--ink:light-dark(#1f2328,#e8eaed);--mut:light-dark(#80868f,#9aa1ab);--line:light-dark(#ebebee,#2c3038);--side:#131417;--red:#e5484d;--H:56px;
  --sky1:light-dark(#ffd9cf,#0d1530);--sky2:light-dark(#ffeede,#1d2550);--sky3:light-dark(#dfe9ff,#2f2a5c);--sun:light-dark(#fff3c4,#f3f0dd);--h1:light-dark(#c9dcc4,#28305a);--h2:light-dark(#a9c9a4,#1f2547);--h3:light-dark(#86b184,#171c38);--bl:light-dark(#f7b6c8,#6b5aa8)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--soft);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;padding:10px;min-height:100vh}
.side{background:var(--side);border-radius:14px;color:#a9adb5;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 0;position:sticky;top:10px;height:calc(100vh - 20px);overflow-y:auto;scrollbar-width:none}
.logo{width:36px;height:36px;border-radius:11px;background:#fff;color:#131417;display:grid;place-items:center;font-weight:700;margin-bottom:8px;flex:none}
.si{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:600;padding:5px 2px;width:70px;border-radius:10px;cursor:pointer;color:inherit;text-decoration:none;flex:none}
.si .ic{width:36px;height:34px;border-radius:10px;display:grid;place-items:center}
.si svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.si:hover{color:#fff}
.si[aria-current=true]{color:#fff}.si[aria-current=true] .ic{background:var(--red);box-shadow:0 0 18px rgba(229,72,77,.55)}
.si.cl .ic{background:#2a2b30}.si.cl:hover .ic{background:#d97757;color:#fff}
.sp{flex:1;min-height:8px}.sep{width:36px;border-top:1px solid #2a2c31;margin:6px 0;flex:none}
.main{background:var(--bg);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
/* Startbild */
.hero{position:relative;height:178px;overflow:hidden;background:var(--sky2)}
.hero>svg,.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,0) 65%)}
.hcap{position:absolute;left:22px;right:22px;bottom:16px;z-index:2;color:#fff}
.hcap h2{margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.hcap p{margin:5px 0 0;font-size:14px;opacity:.95;display:flex;flex-wrap:wrap;gap:4px 14px}
.hcap b{font-weight:600}
.hbt{position:absolute;top:12px;right:12px;z-index:3;display:flex;gap:6px}
.glass{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;border:0;background:rgba(20,20,24,.42);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.glass:hover{background:rgba(20,20,24,.62)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.nv,.rt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h1{font-size:20px;margin:0 6px;font-weight:700;white-space:nowrap}
.kw{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;color:var(--mut)}
.icb{width:36px;height:36px;border-radius:9px;border:0;background:none;cursor:pointer;font-size:20px;line-height:1;flex:none}
.icb:hover,.btn:hover{background:var(--soft)}
.btn{height:36px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.del{color:var(--red)}.btn.sm{height:30px;font-size:13px;padding:0 10px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.flt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line)}
.flt:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500;background:var(--card);cursor:pointer}
.chip i,.pill i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip[aria-pressed=false]{opacity:.42}
#body{flex:1;display:flex;flex-direction:column}
/* Woche */
.wh,.ad,.tg{display:grid;grid-template-columns:58px repeat(var(--n),minmax(0,1fr))}
.wh{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.wh div{padding:10px 4px;font-size:13px;color:var(--mut);text-align:center;font-weight:500;white-space:nowrap}
.wh .t{color:var(--ink);font-weight:700}.wh .t b{background:var(--red);color:#fff;border-radius:999px;padding:2px 7px}
.ad{border-bottom:1px solid var(--line)}
.ad>div{border-left:1px solid var(--line);padding:4px;display:grid;gap:3px;align-content:start;min-height:38px}
.ad .lb{font-size:11px;color:var(--mut);padding:10px 4px;border:0;text-align:center}
.tg{position:relative;height:calc(var(--H) * 13)}
.gut{position:relative}
.hr{position:absolute;right:8px;font-size:11px;color:var(--mut);transform:translateY(-50%);white-space:nowrap}
.col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--H))}
.col.we{background-color:var(--soft)}
.ev,.task{border:0;border-left:3px solid var(--c);border-radius:6px;background:color-mix(in srgb,var(--c) 14%,var(--card));color:color-mix(in srgb,var(--c) 68%,var(--ink));text-align:left;cursor:pointer;font-size:12px;line-height:1.3}
.ev{position:absolute;padding:4px 7px;overflow:hidden}
.ev b,.task span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev b{display:block}.ev small{display:block;opacity:.85;font-size:11.5px;white-space:nowrap}
.kl{background:color-mix(in srgb,var(--c) 20%,var(--card))}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:0 5px;margin-right:4px;vertical-align:1px}
.task{display:flex;gap:6px;align-items:center;padding:3px 6px;min-height:24px}
.done{opacity:.5}.done b,.done span,.done .ti{text-decoration:line-through}
.cb{appearance:none;width:15px;height:15px;border:1.5px solid var(--c);border-radius:4px;margin:0;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--card)}
.cb:checked{background:var(--c)}.cb:checked::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.ev .cb{position:absolute;right:5px;top:5px}
.inf{position:absolute;right:4px;top:4px;width:17px;height:17px;border-radius:50%;background:var(--red);color:#fff;font:italic 700 11px/17px Georgia,serif;text-align:center;box-shadow:0 0 0 2px var(--card)}
.ev.hasinf{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--red) 55%,transparent)}.ev.hasinf b{padding-right:16px}
.warn{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--red) 10%,var(--card));border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));border-radius:10px;padding:10px 12px;margin:0 18px 16px}
.warn .inf{position:static;flex:none;box-shadow:none}.warn div{display:grid;gap:3px;font-size:13.5px}
.now{position:absolute;left:58px;right:0;border-top:1.5px solid var(--red);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-5px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.np{position:absolute;left:4px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;transform:translateY(-50%);z-index:4}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.strip button{border:0;background:none;border-radius:10px;min-height:50px;display:grid;place-content:center;gap:1px;color:var(--mut);cursor:pointer;font-size:12px}
.strip b{font-size:16px;color:var(--ink)}.strip .t b{color:var(--red)}
.strip button[aria-pressed=true]{background:var(--soft)}
/* Monat */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.dn{font-size:12px;color:var(--mut);text-align:center;padding:8px;border-bottom:1px solid var(--line)}
.cell{min-height:122px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:5px}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--soft)}.cell.out .n{opacity:.5}
.cell .n{align-self:flex-end;font-size:13px;color:var(--mut);min-width:24px;height:24px;display:grid;place-items:center}
.cell.td .n{background:var(--red);color:#fff;border-radius:999px;font-weight:700}
.card{border:1px solid var(--line);border-radius:7px;background:var(--card);padding:6px 7px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;text-align:left;display:grid;gap:4px;width:100%}
.card:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.card .h{display:flex;gap:6px;align-items:baseline}
.card b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.card small{font-size:10.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:color-mix(in srgb,var(--c) 15%,var(--card));color:color-mix(in srgb,var(--c) 68%,var(--ink));white-space:nowrap;overflow:hidden;justify-self:start}
.more{font-size:12px;color:var(--mut);background:none;border:0;text-align:left;cursor:pointer;padding:2px 4px}
/* Liste */
.ls{padding:6px 16px 28px;max-width:880px;width:100%}
.dh{font-weight:700;font-size:14px;margin:18px 0 8px}.dh span{color:var(--mut);font-weight:500;margin-left:6px}
.dh.od{color:var(--red)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;margin-bottom:8px;background:var(--card);cursor:pointer;width:100%;text-align:left}
.row:hover{background:var(--soft)}
.tm{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.ti{font-weight:600;display:flex;gap:8px;align-items:center;font-size:14.5px}
.mt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--mut);margin-top:4px}
.empty{margin:30px 16px;border:1.5px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--mut)}
/* Module */
.mods{padding:14px 16px 28px}
.mods h3{font-size:15px;margin:6px 0 10px}
.scroll{overflow-x:auto}
.gantt{min-width:820px;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 0}
.gm{display:grid;grid-template-columns:110px minmax(0,1fr);font-size:11px;color:var(--mut);padding:0 12px 6px}
.gm div{position:relative;height:16px}.gm span{position:absolute;transform:translateX(4px);white-space:nowrap}
.gr{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;padding:3px 12px;min-height:34px}
.gr>b{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.gr>b i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.track{position:relative;height:28px}
.bar{position:absolute;top:2px;height:24px;border-radius:6px;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card));color:color-mix(in srgb,var(--c) 70%,var(--ink));font-size:11.5px;font-weight:600;padding:0 6px;text-align:left;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:8px}
.bar.cur{background:color-mix(in srgb,var(--c) 30%,var(--card));box-shadow:0 0 0 1.5px var(--c) inset}
.bar.past{opacity:.45}
.gl{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.gt{position:absolute;top:6px;bottom:6px;border-left:1.5px solid var(--red);z-index:2;pointer-events:none}
.gt::before{content:"Heute";position:absolute;top:-1px;left:4px;font-size:10px;font-weight:700;color:var(--red)}
.mc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;background:var(--card);padding:12px 14px;cursor:pointer;text-align:left;display:grid;gap:7px;width:100%}
.mcard:hover{background:var(--soft)}
.mcard .f{font-size:12px;font-weight:700;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.mcard b{font-size:14.5px;line-height:1.3}
.prog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--c);border-radius:99px}
.ms{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.lst{display:flex;flex-wrap:wrap;gap:4px}
/* Detailpanel */
.dr{position:fixed;top:10px;right:10px;bottom:10px;width:min(410px,calc(100vw - 20px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);transform:translateX(112%);transition:transform .22s ease;z-index:30;display:flex;flex-direction:column;overflow:auto}
.dr.open{transform:none}
.dhd{padding:16px 18px;border-bottom:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px 14px 0 0;display:flex;gap:10px;align-items:flex-start}
.dhd h2{font-size:20px;margin:8px 0 0;line-height:1.2}
.kv{display:grid;grid-template-columns:112px minmax(0,1fr);gap:9px 12px;padding:16px 18px;margin:0;font-size:14px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.kv select{border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:4px 6px;font-size:14px}
.lnk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;text-align:left}
.sec{padding:0 18px 18px}.sec h3{font-size:12px;color:var(--mut);margin:4px 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.note{white-space:pre-wrap;background:var(--soft);border-radius:9px;padding:10px 12px;margin:0}
.file{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.fi{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:var(--fc);flex:none;overflow:hidden}
.fi img{width:100%;height:100%;object-fit:cover}
.file div{flex:1}.file b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file small{color:var(--mut)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mut);font-size:13px;cursor:pointer}
.drop.over,.drop:hover{border-color:var(--red);color:var(--ink)}
.mrow{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer}
.mrow span{flex:1;font-weight:600;font-size:13.5px}.mrow small{color:var(--mut);white-space:nowrap}
.dft{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.wu{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--mut)}
/* Dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0;width:min(520px,calc(100% - 20px));max-height:92vh;color:var(--ink)}
dialog::backdrop{background:rgba(10,12,16,.5)}
form{padding:18px;display:grid;gap:12px}
form h2{margin:0;font-size:18px}
form p{margin:0;color:var(--mut)}
.r2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--mut)}
form input,form select,form textarea{font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
.lf{border:0;padding:0;margin:0}.lf legend{font-size:13px;font-weight:500;color:var(--mut);padding:0;margin-bottom:6px}
#mLst{display:flex;flex-wrap:wrap;gap:6px}
#mLst label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--ink);cursor:pointer;min-height:36px}
#mLst input{width:auto;accent-color:var(--red);margin:0}
#mLst label:has(input:checked){border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--card))}
.err{color:var(--red)!important;font-weight:600}
.ft{display:flex;gap:8px;justify-content:flex-end}
.demo{font-size:12px;color:var(--mut);padding:10px 16px;margin:0;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;transition:.2s;z-index:40;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.dr,#toast{transition:none}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);padding:0;gap:0}
  .main{border:0;border-radius:0;padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .hero{height:150px;padding-top:env(safe-area-inset-top,0px)}.hcap{left:14px;right:14px;bottom:12px}.hcap h2{font-size:22px}.hcap p{font-size:13px}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;border-radius:0;padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));z-index:20}
  .logo,.sp,.sep{display:none}
  .si{width:62px}
  .si[data-p=kal]{order:1}.si[data-p=auf]{order:2}.si[data-p=mod]{order:3}.si.cl{order:4}.si.aw{order:5}.si[data-p=pru]{order:6}.si[data-p=std]{order:7}.si[data-p=dat]{order:8}#thBtn{order:9}#outBtn{order:10}
  .hero{height:170px}.hcap p{font-size:12.5px;gap:2px 10px}.glass{height:28px;font-size:12px;padding:0 9px}
  .top{padding:10px 12px}h1{font-size:17px}.flt{padding:8px 12px}
  .cell{min-height:86px;padding:3px}.card{padding:4px}.card .pill,.card small{display:none}.card b{font-size:11px}

async function flush(){

      if (op.k === 'up') res = await sb.from(op.t).upsert(op.row);
      else if (op.k === 'del') res = await sb.from(op.t).delete().eq('id', op.id);
      else if (op.k === 'plan') res = await sb.from('planner').upsert({user_id: uid, plan}, {onConflict: 'user_id'});
    } catch(e){ res = {error: {message: String(e && e.message || e)}}; }

      if (isNet(res.error)){ setSync('Offline · wird später abgeglichen'); break; }
      toast('Nicht gespeichert: ' + res.error.message);

function sunTimes(date){
  const toDays = d => d.valueOf() / 864e5 - 0.5 + J1970 - J2000, fromJ = j => new Date((j + 0.5 - J1970) * 864e5);
  const lw = RAD * -LNG, phi = RAD * LAT, d = toDays(date), n = Math.round(d - 0.0009 - lw / (2 * Math.PI));
  const ds = 0.0009 + lw / (2 * Math.PI) + n, M = RAD * (357.5291 + 0.98560028 * ds);
  const L = M + RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + RAD * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(OBL) * Math.sin(L)), noon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(-0.833 * RAD) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const set = J2000 + 0.0009 + (w + lw) / (2 * Math.PI) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return { rise: fromJ(noon - (set - noon)), set: fromJ(set) };
}
const hhmm2 = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
function greeting(d){

}
function drawSun(){
  const now = new Date(), t0 = sunTimes(now);
  let day = now >= t0.rise && now <= t0.set, a, b;
  if (day){ a = t0.rise; b = t0.set; }
  else if (now > t0.set){ a = t0.set; b = sunTimes(add(now, 1)).rise; }
  else { a = sunTimes(add(now, -1)).set; b = t0.rise; }
  const f = Math.max(0, Math.min(1, (now - a) / (b - a))), th = Math.PI * f, cx = 130, cy = 118, r = 108;
  const x = cx - r * Math.cos(th), y = cy - r * Math.sin(th);
  const body = day
    ? `<circle cx="${x}" cy="${y}" r="22" fill="#ffd54a" opacity=".22"/><circle cx="${x}" cy="${y}" r="11" fill="#ffd54a"/>`
    : `<circle cx="${x}" cy="${y}" r="20" fill="#f4f1de" opacity=".14"/><circle cx="${x}" cy="${y}" r="10" fill="#f4f1de" mask="url(#mm)"/>`;
  $('sun').innerHTML = `<svg viewBox="0 0 260 140" aria-hidden="true"><defs><mask id="mm"><rect x="0" y="0" width="260" height="140" fill="#fff"/><circle cx="${x + 5}" cy="${y - 4}" r="9" fill="#000"/></mask></defs>
    <path d="M10 ${cy} H250" stroke="rgba(255,255,255,.45)" stroke-width="1"/>
    <path d="M${cx - r} ${cy} A${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path d="M${cx - r} ${cy} A${r} ${r} 0 0 1 ${x} ${y}" fill="none" stroke="${day ? '#ffe28a' : '#d9d6f5'}" stroke-width="2.5" stroke-linecap="round"/>${body}
    <text x="${cx - r}" y="${cy + 16}" text-anchor="middle">${day ? '↑ ' : '↓ '}${hhmm2(a)}</text><text x="${cx + r}" y="${cy + 16}" text-anchor="middle">${day ? '↓ ' : '↑ '}${hhmm2(b)}</text></svg>
    <div class="lab"><span class="tm2">${hhmm2(now)}</span><span class="gr">${greeting(now)}, ${NAME}</span></div>`;
  $('sun').setAttribute('aria-label', greeting(now) + ', ' + hhmm2(now) + ' Uhr. ' + (day ? 'Sonnenuntergang ' + hhmm2(b) : 'Sonnenaufgang ' + hhmm2(b)) + ' Uhr.');
}

function layout(evs){
  evs.sort((a,b) => a.s - b.s || b.en - a.en);
  let cl = [], lanes = [], end = -1;
  const done_ = () => { cl.forEach(x => x.n = lanes.length); cl = []; lanes = []; };
  for (const x of evs){
    if (cl.length && x.s >= end){ done_(); end = -1; }
    let i = lanes.findIndex(t => t <= x.s);
    if (i < 0){ i = lanes.length; lanes.push(x.en); } else lanes[i] = x.en;
    x.l = i; cl.push(x); end = Math.max(end, x.en);
  }
  done_();
}

function sure(ev, fn, txt){

function wireDr(o){

/* ---------- Dateien ---------- */
const safeName = n => n.normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80) || 'datei';
async function upload(o, list){
  const fs = [...list]; if (!fs.length) return;
  if (!navigator.onLine){ toast('Dateien hochladen geht nur mit Internet'); return; }
  await flush();
  if (outbox.some(op => op.row && op.row.id === o.id)){ toast('Der Eintrag ist noch nicht gespeichert. Bitte gleich noch einmal versuchen.'); return; }
  const msg = $('upmsg'); let n = 0;
  for (const f of fs){
    if (f.size > 50 * 1024 * 1024){ toast(f.name + ' ist größer als 50 MB'); continue; }
    if (msg){ msg.hidden = false; msg.textContent = 'Lade ' + f.name + ' hoch …'; }
    const id = uuid(), path = `${uid}/${o.id}/${id}-${safeName(f.name)}`;
    const up = await sb.storage.from('dateien').upload(path, f, {contentType: f.type || undefined});
    if (up.error){ toast('Hochladen fehlgeschlagen: ' + up.error.message); continue; }
    const row = {id, user_id: uid, entry_id: isMod(o) ? null : o.id, module_id: isMod(o) ? o.id : null, name: f.name, size: f.size, mime: f.type || null, path};
    const r = await sb.from('files').insert(row);
    if (r.error){ sb.storage.from('dateien').remove([path]); toast('Speichern fehlgeschlagen: ' + r.error.message); continue; }
    files.push(row); n++;
  }
  saveCache(); if (sel) drawDr(); render();
  if (n) toast(n === 1 ? 'Datei hochgeladen' : n + ' Dateien hochgeladen');
}
async function delFile(id){
  const f = files.find(x => x.id === id); if (!f) return;
  if (!navigator.onLine){ toast('Löschen geht nur mit Internet'); return; }
  await sb.storage.from('dateien').remove([f.path]);
  const r = await sb.from('files').delete().eq('id', id);
  if (r.error){ toast('Fehler: ' + r.error.message); return; }
  files = files.filter(x => x.id !== id); saveCache(); if (sel) drawDr(); render(); toast('Datei gelöscht');
}
function delEntry(e){
  const fs = filesOf(e);
  if (fs.length && sb && navigator.onLine) sb.storage.from('dateien').remove(fs.map(f => f.path));
  files = files.filter(f => f.entry_id !== e.id);
  entries = entries.filter(i => i.id !== e.id);
  queue({k:'del', t:'entries', id:e.id}); closeDr(); render(); toast('Gelöscht');
}
function delMod(m){
  const fs = filesOf(m);
  if (fs.length && sb && navigator.onLine) sb.storage.from('dateien').remove(fs.map(f => f.path));
  files = files.filter(f => f.module_id !== m.id);
  entries.forEach(i => { if (i.modul_id === m.id) i.modul_id = null; });
  mods = mods.filter(x => x.id !== m.id);
  queue({k:'del', t:'modules', id:m.id}); closeDr(); render(); toast('Modul gelöscht');
}

/* ================= Handy-Oberfläche ================= */
let tab = 'heute', sub = '';
const TABS = [['heute','Heute','<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>'],['woche','Woche',I.kal],['auf','Aufgaben',I.auf],['pru','Prüfungen',I.pru],['mehr','Mehr','<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>']];
const minNow = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const inMin = m => m < 60 ? m + ' Min' : Math.floor(m / 60) + ' Std' + (m % 60 ? ' ' + (m % 60) + ' Min' : '');
const dlong = ds => { const d = pd(ds); return WDL[d.getDay()] + ', ' + d.getDate() + '. ' + MN[d.getMonth()]; };
const dayName = ds => { const n = diff(ds); return n === 0 ? 'Heute' : n === 1 ? 'Morgen' : n === -1 ? 'Gestern' : dlong(ds); };

function item(e){
  const cx = e.status === 'CANCELLED', st = e.status && e.status !== 'REGULAR' ? STAT[e.status] || '' : '';
  const m = e.modul_id && modById(e.modul_id), lk = linkOf(e) && e.typ === 'stunde';

    <div class="tt">${e.von ? `<b>${e.von}</b>${e.bis ? `<small>${e.bis}</small>` : ''}` : '<small>ganz­tägig</small>'}</div>
    <div class="bb"><div class="hh">${cbx(e)}${e.vorlaeufig ? '<i class="q">?</i>' : ''}${tag(e)}<span>${esc(e.titel)}</span>${e.clash && e.clash.length ? '<span class="inf">i</span>' : ''}${lk ? '<span class="nt lkb">↗</span>' : ''}</div>
      <div class="ss">${[st ? '<em>' + st + '</em>' : '', e.raum ? esc(e.raum) : '', e.typ !== 'stunde' ? esc(lbl(e)) : '', m ? esc(m.name) : '', e.vorlaeufig ? 'noch nicht fest' : ''].filter(Boolean).join(' · ')}</div>

}
const agenda = ds => { const ev = evOn(ds); return ev.length ? ev.map(item).join('') : '<p class="emp">Nichts eingetragen.</p>'; };

function nowCard(){

  const hj = t.closest('[data-hj]'); if (hj){ gHj = hj.dataset.hj; render(); return; }
  const gr = t.closest('[data-g]'); if (gr){ openGrade(gr.dataset.g); return; }
  const ng = t.closest('[data-newgrade]'); if (ng){ const e = entries.find(x => x.id === ng.dataset.newgrade); closeDr(); openGrade(null, e ? {fach: e.fach, art: e.art, titel: e.titel, datum: e.datum, entry_id: e.id} : null); return; }
  if (t.closest('#pushOn')){ pushOn(); return; }
  if (t.closest('#pushOff')){ pushOff(); return; }
  if (t.closest('#pushTest')){ pushTest(); return; }
  if (t.closest('[data-addles]')){ openLesson(null); return; }
  const wk = t.closest('[data-wk]'); if (wk){ cur = add(cur, 7 * +wk.dataset.wk); render(); return; }
  const dy = t.closest('[data-day]'); if (dy){ cur = day0(pd(dy.dataset.day)); if (tab !== 'woche') tab = 'woche'; render(); return; }
  const cy = t.closest('[data-cyc]'); if (cy){ const i = entries.find(e => e.id === cy.dataset.cyc); if (i){ const o = ['Nicht begonnen','In Arbeit','Fertig']; i.stand = o[(o.indexOf(i.stand) + 1) % 3]; queue({k:'up', t:'entries', row: rowE(i)}); render(); toast('Vorbereitung: ' + i.stand); } return; }
  if (t.closest('#thBtn')){ theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; lsw('kp-theme', theme); applyTheme(); render(); return; }
  if (t.closest('#outBtn')){ logout(); return; }
  if (t.closest('#untisBtn')){ untisSync(true); return; }
  if (t.closest('#cleanBtn')){ const b = t.closest('#cleanBtn'); if (b.dataset.sure) cleanUp(); else { b.dataset.sure = 1; b.textContent = 'Wirklich endgültig löschen?'; } return; }
  if (t.closest('.cf') || t.closest('summary')) return;
  const rf = t.closest('[data-rmf]'); if (rf){ if (rf.dataset.sure) delFile(rf.dataset.rmf); else { rf.dataset.sure = 1; rf.textContent = 'Löschen?'; } return; }
  const fl = t.closest('a.fl'); if (fl){ if (fl.getAttribute('href') === '#'){ ev.preventDefault(); toast(navigator.onLine ? 'Link wird vorbereitet, bitte noch einmal tippen' : 'Dateien öffnen geht nur mit Internet'); } return; }
  const op = t.closest('[data-open]'); if (op){ openDr(op.dataset.open); return; }
  if (t.closest('#drx')){ closeDr(); return; }
  const e2 = t.closest('[data-id]'); if (e2 && !t.closest('select')){ openDr(e2.dataset.id); }
});
document.addEventListener('change', ev => {
  const s = ev.target.dataset && ev.target.dataset.stand;
  if (s){ const i = entries.find(x => x.id === s); if (i){ i.stand = ev.target.value; queue({k:'up', t:'entries', row: rowE(i)}); toast('Vorbereitung: ' + i.stand); } }
  const ms = ev.target.dataset && ev.target.dataset.mstat;
  if (ms){ const m = modById(ms); if (m){ m.status = ev.target.value; queue({k:'up', t:'modules', row: rowM(m)}); toast('Modul: ' + m.status); } }
});
window.addEventListener('popstate', () => { if (sel) closeDr(); });
setInterval(() => { if (uid && document.visibilityState === 'visible' && tab === 'heute' && !document.querySelector('dialog[open]')) render(); }, 60000);


/* ---------- Anmeldung ---------- */
function showLogin(msg){ $('app').hidden = true; $('login').hidden = false; closeDr(); $('lmsg').textContent = msg || 'Bitte anmelden.'; $('lerr').hidden = true; }
function showApp(){ $('login').hidden = true; $('app').hidden = false; }
$('lf').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('lgo'); b.disabled = true; $('lerr').hidden = true;
  try {
    if (!sb) throw new Error('Die Seite ist noch nicht eingerichtet (config.js).');
    const { data, error } = await sb.auth.signInWithPassword({ email: $('lmail').value.trim(), password: $('lpw').value });
    if (error) throw new Error(/invalid login/i.test(error.message) ? 'E-Mail oder Passwort falsch.' : /fetch|network/i.test(error.message) ? 'Keine Internetverbindung.' : error.message);
    $('lpw').value = ''; await startApp(data.user.id);
  } catch(err){ $('lerr').textContent = err.message; $('lerr').hidden = false; }
  b.disabled = false;
});
async function logout(){
  if (outbox.length && !navigator.onLine){ toast('Es gibt noch ungespeicherte Änderungen. Bitte zuerst mit dem Internet verbinden.'); return; }
  await flush();
  try { if (channel) await sb.removeChannel(channel); await sb.auth.signOut(); } catch(e){}
  [ck(), ok_(), 'kp2-hero-' + uid, 'kp2-heropath-' + uid, 'kp2-user'].forEach(k => lsw(k, null));
  channel = null; started = false; uid = null; entries = []; mods = []; files = []; plan = []; outbox = []; settings = {};
  showHero(''); showLogin('Du wurdest abgemeldet.');
}
async function startApp(id){
  uid = id; lsw('kp2-user', id); loadCache(); showApp(); render(); drawNews();
  showHero(ls('kp2-hero-' + uid, ''));
  if (started) return; started = true;
  if (!navigator.onLine){ setSync('Offline · zeige gespeicherten Stand'); return; }
  setSync('Gleiche ab …');
  if (await pull()){ listen(); untisSync(false); seen(); }
  loadNews();
}
function seen(){
  if (!sb || !uid || !navigator.onLine) return;
  if (settings.last_seen && Date.now() - new Date(settings.last_seen) < 6 * 36e5) return;
  settings.last_seen = new Date().toISOString();
  sb.from('user_settings').upsert({user_id: uid, last_seen: settings.last_seen}, {onConflict: 'user_id'}).then(() => {}, () => {});
}
async function recheck(){
  if (!sb || !navigator.onLine) return;
  let s = null; try { s = (await sb.auth.getSession()).data.session; } catch(e){}
  if (!s){ if (uid) showLogin('Bitte erneut anmelden.'); return; }
  if (!started) return startApp(s.user.id);
  if (await pull()){ listen(); untisSync(false); seen(); }
  loadNews();
}
window.addEventListener('online', recheck);
window.addEventListener('offline', () => setSync('Offline · Änderungen werden später abgeglichen'));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recheck(); });
setInterval(() => { if (document.visibilityState === 'visible' && uid) untisSync(false); }, 15 * 60 * 1000);
setInterval(() => { if (document.visibilityState === 'visible' && uid) loadNews(); }, 10 * 60 * 1000);
setInterval(() => { if (uid && document.visibilityState === 'visible') drawSun(); }, 30 * 1000);

applyTheme();
(async function boot(){
  const c = window.KP_CONFIG || {};
  if (!c.SUPABASE_URL || !c.SUPABASE_KEY || !window.supabase){ showLogin('Die Seite ist noch nicht eingerichtet: config.js fehlt.'); return; }
  sb = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && uid && started) showLogin('Bitte erneut anmelden.'); });
  let session = null; try { session = (await sb.auth.getSession()).data.session; } catch(e){}
  const known = ls('kp2-user', null) || ls('klausurplaner-user', null);
  const kid = known && known[0] === '"' ? JSON.parse(known) : known;
  if (session) startApp(session.user.id);
  else if (!navigator.onLine && kid) startApp(kid);
  else showLogin();
})();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
